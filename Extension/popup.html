<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Surfer</title>
</head>

<body>
  <div class="container">
    <!-- Top bar -->
    <button class="theme-toggle" id="theme-toggle" title="Toggles light & dark" aria-label="auto" aria-live="polite">
      <svg class="sun-and-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
        <mask class="moon" id="moon-mask">
          <rect x="0" y="0" width="100%" height="100%" fill="white" />
          <circle cx="24" cy="10" r="6" fill="black" />
        </mask>
        <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor" />
        <g class="sun-beams" stroke="currentColor" stroke-linecap="round">
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </g>
      </svg>
    </button>

    <!-- Settings gear button -->
    <button class="settings-toggle" id="settings-toggle" title="Settings" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
    </button>

    <!-- Main view -->
    <div id="main-view">
      <div class="title-container">
        <a href="https://github.com/gautamxgambhir/Surferr" class="title">Surfer</a>
      </div>
      <div id="no-key-warning" class="warning-banner" style="display:none;">
        ⚠️ No API key set. Open settings to add one.
      </div>
      <div class="radio-container">
        <label>
          <input type="radio" name="action" value="website_info" checked class="radios"> Website Information
        </label>
        <label>
          <input type="radio" name="action" value="webpage_summary" class="radios"> Webpage Content Summary
        </label>
      </div>
      <button id="submit" class="submit">Submit</button>
      <div class="summary-wrapper">
        <div id="summaryContainer" class="summaryContainer" title="Click to copy"></div>
        <div id="copiedText" class="copiedText">Summary copied to clipboard!</div>
      </div>
    </div>

    <!-- Settings view -->
    <div id="settings-view" style="display:none;">
      <div class="title-container">
        <span class="settings-title">Settings</span>
      </div>

      <div class="settings-form">
        <label class="settings-label" for="service-select">AI Service</label>
        <select id="service-select" class="settings-select">
          <option value="together">Together AI</option>
          <option value="openai">OpenAI</option>
          <option value="groq">Groq</option>
          <option value="anthropic">Anthropic</option>
          <option value="gemini">Google Gemini</option>
        </select>

        <label class="settings-label" for="model-input">Model ID <span class="settings-hint">(leave blank for default)</span></label>
        <input type="text" id="model-input" class="settings-input" placeholder="e.g. gpt-4o-mini, llama3-8b-8192" />

        <label class="settings-label" for="api-key-input">API Key</label>
        <div class="api-key-wrapper">
          <input type="password" id="api-key-input" class="settings-input" placeholder="Paste your API key here" />
          <button id="toggle-key-visibility" class="toggle-key-btn" title="Show/hide key" aria-label="Toggle key visibility">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <button id="save-settings" class="submit settings-save-btn">Save</button>
        <div id="settings-status" class="settings-status"></div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
